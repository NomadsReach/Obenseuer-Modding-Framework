<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>focus</title>
<style>
html, body { margin: 0; height: 100%; background: #ffffff; font: 16px sans-serif; }
#field { position: absolute; left: 300px; top: 200px; width: 300px; height: 32px; }
#blank { position: absolute; left: 600px; top: 480px; width: 400px; height: 120px; background: #eeeeee; }
#btn { position: absolute; left: 300px; top: 320px; width: 160px; height: 40px; }
#pick { position: absolute; left: 300px; top: 400px; width: 160px; height: 32px; }
#nav { position: absolute; left: 650px; top: 200px; width: 100px; height: 32px; line-height: 32px; }
</style>
</head>
<body>
<input id="field" type="text">
<div id="blank">Blank area</div>
<button id="btn">Button</button>
<select id="pick"><option>One</option><option>Two</option><option>Three</option></select>
<a id="nav" href="nav.html">Next</a>
<script>
document.getElementById('field').addEventListener('input', function (e) {
    chrome.webview.postMessage({ type: 'typed', value: e.target.value });
});
document.addEventListener('mousedown', function (e) {
    chrome.webview.postMessage({ type: 'pressed', target: e.target.id });
});
document.addEventListener('dblclick', function (e) {
    chrome.webview.postMessage({ type: 'dbl', target: e.target.id });
});
chrome.webview.addEventListener('message', function (e) {
    if (e.data.type !== 'rect') return;
    var r = document.getElementById('field').getBoundingClientRect();
    chrome.webview.postMessage({ type: 'rect', x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2) });
});
chrome.webview.postMessage({ type: 'focus-ready' });
</script>
</body>
</html>
